<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canvas scrub</title>
  <link rel="stylesheet" href="lib/base.css" />
  <style>
    .spacer { height: 220vh; }
    .stage {
      position: sticky; top: 0; height: 100vh;
      display: grid; place-items: center;
    }
    canvas { width: min(90vw, 420px); height: auto; border-radius: 16px; background: #111; }
    .hud {
      position: fixed; right: 16px; top: 16px; color: var(--muted); font-size: 13px;
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">frame 0</div>
  <div class="wrap">
    <nav class="top"><a href="index.html">← демо</a></nav>
    <p class="kicker">requestAnimationFrame + dirty flag</p>
    <h1>Скролл листает кадры</h1>
    <p class="lead">Как CSS-Tricks / ранний Apple sequence, но кадры рисуются кодом. Scroll только ставит dirty; рисует rAF. Passive listener.</p>
  </div>
  <div class="spacer">
    <div class="stage"><canvas id="c" width="840" height="1200"></canvas></div>
  </div>
  <div class="wrap"><p class="note">120 виртуальных кадров. Progress секции → индекс. Назад по скроллу = реверс «фильма».</p></div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const hud = document.getElementById("hud");
    const FRAMES = 120;
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let dirty = true;

    function progress() {
      const start = 0;
      const end = document.body.scrollHeight - innerHeight;
      if (end <= 0) return 0;
      return Math.min(1, Math.max(0, scrollY / end));
    }

    function draw(p) {
      const w = canvas.width;
      const h = canvas.height;
      const i = Math.round(p * (FRAMES - 1));
      hud.textContent = "frame " + i + " / " + (FRAMES - 1);
      ctx.fillStyle = "#0b0b0c";
      ctx.fillRect(0, 0, w, h);
      const angle = -0.6 + p * 1.2;
      const cx = w / 2;
      const cy = h / 2 + Math.sin(p * Math.PI) * -40;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      const pw = 280, ph = 580, r = 48;
      ctx.fillStyle = "#1d1d1f";
      ctx.strokeStyle = "#6e6e73";
      ctx.lineWidth = 8;
      roundRect(-pw / 2, -ph / 2, pw, ph, r);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#000";
      roundRect(-pw / 2 + 18, -ph / 2 + 48, pw - 36, ph - 96, 24);
      ctx.fill();
      ctx.fillStyle = "rgba(41,151,255," + (0.25 + 0.5 * p) + ")";
      ctx.beginPath();
      ctx.arc(0, -ph / 2 + 120 + p * 220, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    addEventListener("scroll", () => { dirty = true; }, { passive: true });
    addEventListener("resize", () => { dirty = true; }, { passive: true });

    function tick() {
      requestAnimationFrame(tick);
      if (!dirty) return;
      dirty = false;
      draw(reduced ? 0.45 : progress());
    }
    tick();
  </script>
</body>
</html>
